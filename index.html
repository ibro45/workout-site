<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#18181b">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Workout App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column in the shadcn/ui look. Header, tabs, then two bordered cards of rows.
   Left zone ticks, the rest of the row opens the demo. Colors are shadcn's zinc palette. */
:root {
  --background: #ffffff; --foreground: #09090b; --muted: #f4f4f5; --muted-foreground: #71717a;
  --border: #e4e4e7; --input: #d4d4d8; --primary: #18181b; --primary-foreground: #fafafa;
  --destructive: #dc2626; --destructive-foreground: #fafafa; --warning: #a16207; --demo: #ffffff;
  --sans: "Geist", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: #09090b; --foreground: #fafafa; --muted: #27272a; --muted-foreground: #a1a1aa;
    --border: #27272a; --input: #52525b; --primary: #fafafa; --primary-foreground: #18181b;
    --destructive: #ef4444; --destructive-foreground: #fafafa; --warning: #facc15; --demo: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: #09090b; --foreground: #fafafa; --muted: #27272a; --muted-foreground: #a1a1aa;
  --border: #27272a; --input: #52525b; --primary: #fafafa; --primary-foreground: #18181b;
  --destructive: #ef4444; --destructive-foreground: #fafafa; --warning: #facc15; --demo: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--background); color: var(--foreground); font: 400 15px/1.4 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--background); }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 16px 32px; display: grid; gap: 10px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { font: 600 1.25rem/1.2 var(--sans); letter-spacing: -.02em; margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--foreground); outline-offset: 2px; }
.clear { flex: none; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; font-size: .875rem; font-weight: 500; background: var(--background); }
.clear.armed { background: var(--destructive); border-color: var(--destructive); color: var(--destructive-foreground); }

/* Tabs: each carries a thin bar for how much of that session is ticked. */
.tabs-shell { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-block: 4px; background: var(--background); }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; padding: 3px; border-radius: 8px; background: var(--muted); }
.tab { display: grid; gap: 5px; padding: 7px 4px 5px; border-radius: 6px; color: var(--muted-foreground); font-size: .875rem; font-weight: 500; text-align: center; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.bar { display: block; height: 2px; margin-inline: 6px; border-radius: 1px; background: var(--input); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--foreground); }

#list { display: grid; gap: 14px; }
.pane { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.pane-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; font-size: .875rem; font-weight: 600; }
.count { font-weight: 400; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.item { border-top: 1px solid var(--border); scroll-margin-top: 60px; }
.row { display: flex; align-items: stretch; min-height: 58px; }

.tick { flex: none; position: relative; width: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.tick input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.box { position: relative; z-index: 1; width: 22px; height: 22px; border: 1px solid var(--input); border-radius: 5px; display: grid; place-items: center; background: var(--background); }
.box::after { content: ""; width: 11px; height: 6px; border: 2px solid transparent; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.tick input:checked + .box { background: var(--primary); border-color: var(--primary); }
.tick input:checked + .box::after { border-color: var(--primary-foreground); }
.tick input:focus-visible + .box { outline: 2px solid var(--foreground); outline-offset: 2px; }
.dash { color: var(--muted-foreground); }

/* A line between tick boxes links the two halves of a superset. */
.p1 .tick::after, .p2 .tick::after { content: ""; position: absolute; left: 24.5px; width: 1px; background: var(--input); }
.p1 .tick::after { top: 50%; bottom: -1px; }
.p2 .tick::after { top: 0; bottom: 50%; }

.info { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; gap: 10px; align-items: center; padding: 9px 14px 9px 0; }
.txt { min-width: 0; }
.name { display: block; font-weight: 500; }
.chip { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 5px; background: var(--muted); font-size: .72rem; font-weight: 600; vertical-align: 1px; }
.note { display: block; margin-top: 1px; font-size: .8125rem; color: var(--muted-foreground); }
.dose { text-align: right; white-space: nowrap; }
.dose b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
.dose small { display: block; font-size: .72rem; line-height: 1.2; color: var(--muted-foreground); }
.chev { width: 12px; height: 12px; justify-self: end; color: var(--muted-foreground); transition: transform .15s; }
.item.open .chev { transform: rotate(180deg); }

.row.done .name, .row.done .note, .row.done .dose b, .row.done .dose small { color: var(--muted-foreground); font-weight: 400; }
.item.skip .name, .item.skip .dose b { color: var(--muted-foreground); font-weight: 400; }
.item.skip .note { color: var(--warning); }

.demo { padding: 2px 14px 14px 50px; }
.demo img, .demo video { display: block; width: 100%; max-width: 300px; aspect-ratio: 1; object-fit: contain; border: 1px solid var(--border); border-radius: 8px; background: var(--demo); }
.desc { margin: -4px 0 0; font-size: .875rem; color: var(--muted-foreground); }
.card.err { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--destructive); border-radius: 12px; font-size: .875rem; }
.card.err > b { color: var(--destructive); font-weight: 600; }
.card.err.warn { border-color: var(--warning); }
.card.err.warn > b { color: var(--warning); }
.card.err pre { margin: 0; font: 400 .8125rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.card.err small { color: var(--muted-foreground); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>

<div class="wrap">
  <div class="head"><h1 id="heading">Strength program</h1><button class="clear" id="clear" type="button">Reset</button></div>
  <p class="desc" id="desc" hidden></p>
  <div class="card err" id="err" hidden></div>
  <div class="tabs-shell" id="tabs-shell" hidden><div class="tabs" id="tabs" role="tablist" aria-label="Sessions"></div></div>
  <div id="list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="program.js"></script>
<script>
// The program comes from program.yaml (see program.js). The last version that
// loaded is kept so a typo or no signal never leaves the page blank.
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  drop(k) { try { localStorage.removeItem(k); } catch {} },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = id => document.getElementById(id);
const chevron = '<svg class="chev" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let program = null;          // normalised program being shown
let tab = 0;                 // index of the current session
let ticks = store.get("hrs-ticks4") || {};   // { session name: { exercise key: true } }
let openKey = null;          // "<section>:<row>" of the open demo

const session = () => program.sessions[tab];
const sessionTicks = () => ticks[session().name] || {};
const counted = sec => sec.rows.filter(r => !r.skip);
const tally = rows => { const t = sessionTicks(); return [rows.filter(r => t[r.key]).length, rows.length]; };
const saveTicks = () => store.set("hrs-ticks4", ticks);

function rowHtml(r, id) {
  const done = !r.skip && !!sessionTicks()[r.key];
  const link = r.pair ? (r.pair.endsWith("1") ? " p1" : " p2") : "";
  const tick = r.skip
    ? `<span class="tick" aria-hidden="true"><span class="dash">–</span></span>`
    : `<label class="tick"><input type="checkbox" data-tick="${id}"${done ? " checked" : ""}><span class="box" aria-hidden="true"></span><span class="sr">Done: ${esc(r.name)}</span></label>`;
  return `<div class="item${link}${r.skip ? " skip" : ""}" data-item="${id}"><div class="row${done ? " done" : ""}">${tick}` +
    `<button class="info" type="button" data-open="${id}" aria-expanded="false">` +
    `<span class="txt"><span class="name">${r.pair ? `<span class="chip">${esc(r.pair)}</span>` : ""}${esc(r.name)}</span>${r.cue ? `<span class="note">${esc(r.cue)}</span>` : ""}</span>` +
    `<span class="dose"><b>${esc(r.amount)}</b>${r.unit ? `<small>${esc(r.unit)}</small>` : ""}</span>${chevron}<span class="sr">Show demo</span></button></div></div>`;
}

const rowAt = id => { const [s, r] = id.split(":").map(Number); return session().sections[s].rows[r]; };

function renderTabs() {
  $("tabs").innerHTML = program.sessions.map((s, i) => {
    const t = ticks[s.name] || {};
    const rows = s.sections.flatMap(counted), d = rows.filter(r => t[r.key]).length, n = rows.length;
    return `<button class="tab" type="button" role="tab" data-i="${i}" aria-selected="${i === tab}" aria-label="${esc(s.name)}, ${d} of ${n} done">${esc(s.name)}<span class="bar"><span style="width:${n ? d / n * 100 : 0}%"></span></span></button>`;
  }).join("");
}

function refreshProgress() {
  renderTabs();
  session().sections.forEach((sec, s) => {
    const [d, n] = tally(counted(sec));
    const el = document.querySelector(`[data-count="${s}"]`);
    if (el) el.textContent = `${d}/${n}`;
  });
}

function renderSession() {
  openKey = null;
  $("list").innerHTML = session().sections.map((sec, s) =>
    `<section class="pane"><div class="pane-h"><span>${esc(sec.name)}</span><span class="count" data-count="${s}"></span></div>` +
    sec.rows.map((r, i) => rowHtml(r, `${s}:${i}`)).join("") + `</section>`).join("");
  disarmClear();
  refreshProgress();
  store.set("hrs-tab4", session().name);
}

function show(p) {
  program = p;
  $("tabs-shell").hidden = false;
  document.title = p.title;
  $("heading").textContent = p.heading;
  $("desc").textContent = p.description;
  $("desc").hidden = !p.description;
  const want = store.get("hrs-tab4");
  tab = Math.max(0, p.sessions.findIndex(s => s.name === want));
  renderSession();
}

function showProblems(errors, warnings) {
  const box = $("err"), list = [...errors, ...warnings];
  box.hidden = !list.length;
  if (!list.length) return;
  box.classList.toggle("warn", !errors.length);
  box.innerHTML = `<b>${errors.length ? "Can't read program.yaml" : "Check program.yaml"}</b>` +
    `<pre>${esc(list.join("\n"))}</pre>` +
    (errors.length && program ? `<small>Showing the last version that worked</small>` : "");
}

async function load() {
  const cached = store.get("hrs-program4");
  // A saved copy from an older version could be unreadable: forget it and carry on.
  if (cached) try { show(cached); } catch { program = null; store.drop("hrs-program4"); $("tabs-shell").hidden = true; }
  let result;
  try {
    if (!window.jsyaml) throw new Error("the YAML reader didn't load (no connection?)");
    const res = await fetch("program.yaml", { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    result = Program.parse(await res.text(), jsyaml);
  } catch (e) {
    result = { program: null, errors: [`Couldn't load program.yaml: ${e.message}`], warnings: [] };
  }
  if (result.program) {
    // One-time move of old position-based ticks to name-based ones.
    const old = store.get("hrs-ticks3");
    if (old && !store.get("hrs-ticks4")) { ticks = Program.migrateTicks(old, result.program); saveTicks(); }
    store.drop("hrs-ticks3"); store.drop("hrs-tab3");
    store.set("hrs-program4", result.program);
    show(result.program);
  }
  showProblems(result.errors, result.warnings);
}

function closeDemo() {
  if (openKey === null) return;
  const item = document.querySelector(`[data-item="${openKey}"]`);
  if (item) {
    item.classList.remove("open");
    item.querySelector(".demo")?.remove();
    item.querySelector("[data-open]").setAttribute("aria-expanded", "false");
  }
  openKey = null;
}

function toggleDemo(btn) {
  const key = btn.dataset.open, wasOpen = key === openKey, r = rowAt(key);
  closeDemo();
  if (wasOpen || !r.demo) return;
  const item = btn.closest(".item");
  const panel = document.createElement("div");
  panel.className = "demo";
  let media;
  if (r.demo.endsWith(".mp4")) {
    // Muted, inline, looping video: far smaller than an animated image.
    media = document.createElement("video");
    media.muted = true; media.loop = true; media.autoplay = true; media.playsInline = true;
    media.setAttribute("muted", ""); media.setAttribute("playsinline", "");
    media.setAttribute("aria-label", `${r.name} demo`);
  } else {
    media = document.createElement("img");
    media.alt = `${r.name} demo`;
  }
  media.src = `demos/${r.demo}`;
  panel.append(media);
  item.append(panel);
  item.classList.add("open");
  btn.setAttribute("aria-expanded", "true");
  openKey = key;
  // Closing a demo higher up can move this row, so bring it back into view.
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  item.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
}

// Clearing takes two taps so a stray tap mid-workout can't wipe the session.
let armTimer;
function disarmClear() {
  clearTimeout(armTimer);
  const b = $("clear");
  b.classList.remove("armed");
  b.textContent = "Reset";
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || +b.dataset.i === tab) return;
  tab = +b.dataset.i;
  renderSession();
  scrollTo(0, 0);
});
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-open]");
  if (b) toggleDemo(b);
});
$("list").addEventListener("change", e => {
  const cb = e.target, id = cb.dataset.tick, r = rowAt(id), name = session().name;
  ticks[name] = ticks[name] || {};
  if (cb.checked) ticks[name][r.key] = true; else delete ticks[name][r.key];
  cb.closest(".row").classList.toggle("done", cb.checked);
  if (cb.checked && id === openKey) closeDemo();
  saveTicks();
  refreshProgress();
});
$("clear").addEventListener("click", e => {
  const b = e.currentTarget;
  if (!program) return;
  if (!b.classList.contains("armed")) {
    b.classList.add("armed");
    b.textContent = "Confirm reset";
    armTimer = setTimeout(disarmClear, 3000);
    return;
  }
  delete ticks[session().name];
  saveTicks();
  renderSession();
});
load();
</script>

</html>
