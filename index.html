<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#18181b">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Workout App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column in the shadcn/ui look. Header, tabs, then two bordered cards of rows.
   Left zone ticks, the rest of the row opens the demo. Colors are shadcn's zinc palette. */
:root {
  --background: #ffffff; --foreground: #09090b; --muted: #f4f4f5; --muted-foreground: #71717a;
  --border: #e4e4e7; --input: #d4d4d8; --primary: #18181b; --primary-foreground: #fafafa;
  --destructive: #dc2626; --destructive-foreground: #fafafa; --warning: #a16207; --demo: #ffffff;
  --sans: "Geist", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: #09090b; --foreground: #fafafa; --muted: #27272a; --muted-foreground: #a1a1aa;
    --border: #27272a; --input: #52525b; --primary: #fafafa; --primary-foreground: #18181b;
    --destructive: #ef4444; --destructive-foreground: #fafafa; --warning: #facc15; --demo: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: #09090b; --foreground: #fafafa; --muted: #27272a; --muted-foreground: #a1a1aa;
  --border: #27272a; --input: #52525b; --primary: #fafafa; --primary-foreground: #18181b;
  --destructive: #ef4444; --destructive-foreground: #fafafa; --warning: #facc15; --demo: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--background); color: var(--foreground); font: 400 15px/1.4 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--background); }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 16px 32px; display: grid; gap: 10px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { font: 600 1.25rem/1.2 var(--sans); letter-spacing: -.02em; margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible { outline: 2px solid var(--foreground); outline-offset: 2px; }
.clear { flex: none; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; font-size: .875rem; font-weight: 500; background: var(--background); }
.clear.armed { background: var(--destructive); border-color: var(--destructive); color: var(--destructive-foreground); }

/* Tabs: each carries a thin bar for how much of that session is ticked. */
.tabs-shell { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-block: 4px; background: var(--background); }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 8px; background: var(--muted); }
.tab { display: grid; gap: 5px; padding: 7px 4px 5px; border-radius: 6px; color: var(--muted-foreground); font-size: .875rem; font-weight: 500; text-align: center; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.bar { display: block; height: 2px; margin-inline: 6px; border-radius: 1px; background: var(--input); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--foreground); }

#list { display: grid; gap: 14px; }
.pane { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.pane-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; font-size: .875rem; font-weight: 600; }
.count { font-weight: 400; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.item { border-top: 1px solid var(--border); scroll-margin-top: 60px; }
.row { display: flex; align-items: stretch; min-height: 58px; }

.tick { flex: none; position: relative; width: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.tick input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.box { position: relative; z-index: 1; width: 22px; height: 22px; border: 1px solid var(--input); border-radius: 5px; display: grid; place-items: center; background: var(--background); }
.box::after { content: ""; width: 11px; height: 6px; border: 2px solid transparent; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.tick input:checked + .box { background: var(--primary); border-color: var(--primary); }
.tick input:checked + .box::after { border-color: var(--primary-foreground); }
.tick input:focus-visible + .box { outline: 2px solid var(--foreground); outline-offset: 2px; }
.dash { color: var(--muted-foreground); }

/* A line between tick boxes links the two halves of a superset. */
.p1 .tick::after, .p2 .tick::after { content: ""; position: absolute; left: 24.5px; width: 1px; background: var(--input); }
.p1 .tick::after { top: 50%; bottom: -1px; }
.p2 .tick::after { top: 0; bottom: 50%; }

.info { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; gap: 10px; align-items: center; padding: 9px 14px 9px 0; }
.txt { min-width: 0; }
.name { display: block; font-weight: 500; }
.chip { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 5px; background: var(--muted); font-size: .72rem; font-weight: 600; vertical-align: 1px; }
.note { display: block; margin-top: 1px; font-size: .8125rem; color: var(--muted-foreground); }
.dose { text-align: right; white-space: nowrap; }
.dose b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
.dose small { display: block; font-size: .72rem; line-height: 1.2; color: var(--muted-foreground); }
.chev { width: 12px; height: 12px; justify-self: end; color: var(--muted-foreground); transition: transform .15s; }
.item.open .chev { transform: rotate(180deg); }

.row.done .name, .row.done .note, .row.done .dose b, .row.done .dose small { color: var(--muted-foreground); font-weight: 400; }
.item.skip .name, .item.skip .dose b { color: var(--muted-foreground); font-weight: 400; }
.item.skip .note { color: var(--warning); }

.demo { padding: 2px 14px 14px 50px; }
.demo img { display: block; width: 100%; max-width: 300px; aspect-ratio: 1; object-fit: contain; border: 1px solid var(--border); border-radius: 8px; background: var(--demo); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>

<div class="wrap">
  <div class="head"><h1>Strength program</h1><button class="clear" id="clear" type="button"></button></div>
  <div class="tabs-shell"><div class="tabs" id="tabs" role="tablist" aria-label="Sessions"></div></div>
  <div id="list"></div>
</div>

<script>
// Row: [name, dose, note, pair, skip]
const climber = ["Banded mountain climber", "2×6/side"];
const sidePlank = ["Side plank + leg raise", "2×6–8/side", "On forearm"];
const birdDog = ["Bird dog", "2×6/side", "5 s hold"];
const kneeDrive = ["Banded knee drive", "2×8/side"];
const bandWalk = ["Lateral band walk", "2×10 each way", "Band above knees"];
const slump = ["Lying nerve glide", "2×10–15", "Right leg"];

const SESSIONS = [
  { label: "Upper 1",
    warm: [["Shoulder mobility", "5 min", "Pass-throughs, pull-aparts, wall slides"], climber, sidePlank, birdDog],
    main: [
      ["Weighted pull-up", "3–4×3–6", "", "A1"],
      ["Standing 1-arm DB press", "3×4–6/side", "No sideways lean", "A2"],
      ["Weighted dip", "3×5–8", "", "B1"],
      ["DB curl", "3×8–10", "", "B2"],
      ["DB lateral raise", "3×10–15"],
      ["Neck flexion, extension, lateral", "2×10–15 each", "Light plate, slow"],
    ] },
  { label: "Lower 1",
    warm: [kneeDrive, bandWalk, ["Lateral hop-and-stick", "2×3/side", "Small, quiet landing"], slump],
    main: [
      ["Kickstand DB RDL", "3×6–8/leg", "3 s down, stop before nerve symptoms"],
      ["Heel-elevated split squat", "3×4–6/leg", "Front heel on wedge"],
      ["Incline hamstring curl", "3×8–12", "EZ Boot"],
      ["Ring fallout", "2×6–8", "Later: ab-wheel rollout 3×6–10"],
      ["Suitcase carry", "2×30–40 s/side"],
      ["Band tibialis raise", "2×15–20", "Seated, knees bent", "A1"],
      ["Calf raise", "3×10–15", "Toes on wedge", "A2"],
    ] },
  { label: "Upper 2",
    warm: [climber, sidePlank, birdDog],
    main: [
      ["Dynamic band chop", "2×4–6/side", "Fast, controlled"],
      ["DB bench press", "3×5–6", "", "A1"],
      ["Rope / towel pull-up", "3×5–8", "", "A2"],
      ["1-arm DB row", "3×5–8/side", "Straps"],
      ["Face pull", "2–3×12–20"],
      ["Neck isometrics", "3×20 s each way"],
    ] },
  { label: "Lower 2",
    warm: [kneeDrive, bandWalk, ["Dead bug", "2×6/side"], slump],
    main: [
      ["KB swing", "3×5–6", "Skip until back healed", "", true],
      ["Bulgarian split squat", "3×5–8/leg"],
      ["Back extension", "2×10–15", "Top half of the range at first, soft knees, stop at a straight line"],
      ["Weighted hip flexion", "2×8–12/leg", "EZ Boot, knee bent"],
      ["Copenhagen plank", "2×20–30 s/side"],
      ["KB pick-up", "2–3×60 s", "Last. Nonstop, alternate sides; stop if form slips"],
    ] },
];

// Exercise name → demo in gif/.
const G = {
  "Shoulder mobility": "ly-shoulder.webp", "Banded mountain climber": "ly-climber.webp",
  "Side plank + leg raise": "ly-side-plank.webp", "Bird dog": "ly-bird-dog.webp",
  "Banded knee drive": "ly-hip-flexion.webp", "Lateral band walk": "ly-band-walk.webp",
  "Lateral hop-and-stick": "ly-skater.webp", "Dead bug": "ly-dead-bug.webp", "Lying nerve glide": "nerve-glide-lying.webp",
  "Weighted pull-up": "ly-pull-up.webp", "Standing 1-arm DB press": "ly-press.webp",
  "DB lateral raise": "ly-lateral-raise.webp", "Weighted dip": "ly-dip.webp", "DB curl": "ly-curl.webp",
  "Neck flexion, extension, lateral": "neck-3way.webp", "Neck isometrics": "neck.jpg",
  "Kickstand DB RDL": "kickstand-rdl-b.webp", "Heel-elevated split squat": "ly-split-squat.webp", "Incline hamstring curl": "ly-leg-curl.webp",
  "Ring fallout": "ly-fallout.webp", "Suitcase carry": "ly-suitcase.webp",
  "Band tibialis raise": "tib-band.webp", "Calf raise": "ly-calf.webp",
  "Dynamic band chop": "ly-band-chop.webp", "DB bench press": "ly-db-bench.webp", "Rope / towel pull-up": "towel-pull-up.webp",
  "1-arm DB row": "ly-row.webp", "Face pull": "ly-face-pull.webp",
  "KB swing": "ly-kb-swing.webp", "Bulgarian split squat": "ly-bss.webp", "KB pick-up": "kb-crossover.webp",
  "Back extension": "ly-back-ext.webp", "Weighted hip flexion": "ly-hip-flexion.webp", "Copenhagen plank": "ly-copenhagen.webp",
};

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = id => document.getElementById(id);
const chevron = '<svg class="chev" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let tab = store.get("hrs-tab3") || 0;
if (!SESSIONS[tab]) tab = 0;
const ticks = store.get("hrs-ticks3") || {};
let openKey = null;

// "3×6–8/leg" → ["3×6–8", "per leg"], "2×10 each way" → ["2×10", "each way"]
function splitDose(dose) {
  const m = dose.match(/^(.*?)(\/\w+| each way| each)$/);
  return m ? [m[1].trim(), m[2].trim().replace("/", "per ")] : [dose, ""];
}

// Rows that can be ticked, with their storage keys. Skipped rows don't count.
function rowsOf(i, part) {
  const prefix = part === "warm" ? `${i}-w` : `${i}-`;
  return SESSIONS[i][part].map((r, n) => ({ key: prefix + n, skip: r[4] })).filter(r => !r.skip);
}
function tally(rows) { return [rows.filter(r => ticks[r.key]).length, rows.length]; }

function rowHtml(key, [name, dose, note, pair, skip]) {
  const done = !skip && !!ticks[key];
  const [amount, unit] = splitDose(dose);
  const link = pair ? (pair.endsWith("1") ? " p1" : " p2") : "";
  const tick = skip
    ? `<span class="tick" aria-hidden="true"><span class="dash">–</span></span>`
    : `<label class="tick"><input id="t-${key}" type="checkbox" data-key="${key}"${done ? " checked" : ""}><span class="box" aria-hidden="true"></span><span class="sr">Done: ${esc(name)}</span></label>`;
  return `<div class="item${link}${skip ? " skip" : ""}" data-item="${key}"><div class="row${done ? " done" : ""}">${tick}` +
    `<button class="info" type="button" data-open="${key}" data-gif="${esc(G[name] || "")}" data-name="${esc(name)}" aria-expanded="false">` +
    `<span class="txt"><span class="name">${pair ? `<span class="chip">${pair}</span>` : ""}${esc(name)}</span>${note ? `<span class="note">${esc(note)}</span>` : ""}</span>` +
    `<span class="dose"><b>${esc(amount)}</b>${unit ? `<small>${esc(unit)}</small>` : ""}</span>${chevron}<span class="sr">Show demo</span></button></div></div>`;
}

function groupHtml(title, part) {
  const s = SESSIONS[tab];
  const prefix = part === "warm" ? `${tab}-w` : `${tab}-`;
  return `<section class="pane" data-pane="${part}"><div class="pane-h"><span>${title}</span><span class="count" data-count="${part}"></span></div>` +
    s[part].map((r, n) => rowHtml(prefix + n, r)).join("") + `</section>`;
}

function renderTabs() {
  $("tabs").innerHTML = SESSIONS.map((s, i) => {
    const [d, n] = tally([...rowsOf(i, "warm"), ...rowsOf(i, "main")]);
    return `<button class="tab" type="button" role="tab" data-i="${i}" aria-selected="${i === tab}" aria-label="${s.label}, ${d} of ${n} done">${s.label}<span class="bar"><span style="width:${n ? d / n * 100 : 0}%"></span></span></button>`;
  }).join("");
}

function refreshProgress() {
  renderTabs();
  for (const part of ["warm", "main"]) {
    const [d, n] = tally(rowsOf(tab, part));
    const el = document.querySelector(`[data-count="${part}"]`);
    if (el) el.textContent = `${d}/${n}`;
  }
}

function renderSession() {
  openKey = null;
  $("list").innerHTML = groupHtml("Warm-up", "warm") + groupHtml("Workout", "main");
  disarmClear();
  refreshProgress();
  store.set("hrs-tab3", tab);
}

function closeDemo() {
  if (openKey === null) return;
  const item = document.querySelector(`[data-item="${openKey}"]`);
  if (item) {
    item.classList.remove("open");
    item.querySelector(".demo")?.remove();
    item.querySelector("[data-open]").setAttribute("aria-expanded", "false");
  }
  openKey = null;
}

function toggleDemo(btn) {
  const key = btn.dataset.open, wasOpen = key === openKey;
  closeDemo();
  if (wasOpen || !btn.dataset.gif) return;
  const item = btn.closest(".item");
  const panel = document.createElement("div");
  panel.className = "demo";
  const img = document.createElement("img");
  img.src = `gif/${btn.dataset.gif}`;
  img.alt = `${btn.dataset.name} demo`;
  panel.append(img);
  item.append(panel);
  item.classList.add("open");
  btn.setAttribute("aria-expanded", "true");
  openKey = key;
  // Closing a demo higher up can move this row, so bring it back into view.
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  item.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
}

// Clearing takes two taps so a stray tap mid-workout can't wipe the session.
let armTimer;
function disarmClear() {
  clearTimeout(armTimer);
  const b = $("clear");
  b.classList.remove("armed");
  b.textContent = "Reset";
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || +b.dataset.i === tab) return;
  tab = +b.dataset.i;
  renderSession();
  scrollTo(0, 0);
});
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-open]");
  if (b) toggleDemo(b);
});
$("list").addEventListener("change", e => {
  const cb = e.target, key = cb.dataset.key;
  ticks[key] = cb.checked;
  cb.closest(".row").classList.toggle("done", cb.checked);
  if (cb.checked && key === openKey) closeDemo();
  store.set("hrs-ticks3", ticks);
  refreshProgress();
});
$("clear").addEventListener("click", e => {
  const b = e.currentTarget;
  if (!b.classList.contains("armed")) {
    b.classList.add("armed");
    b.textContent = "Confirm reset";
    armTimer = setTimeout(disarmClear, 3000);
    return;
  }
  for (const k in ticks) if (k.startsWith(`${tab}-`)) delete ticks[k];
  store.set("hrs-ticks3", ticks);
  renderSession();
});
renderSession();
</script>

</html>
