# Workout App program. Edit, commit, and the site updates in about a minute.
# Everything in this file is public.
#
# Each exercise:  name (required), reps or time (one required), sets, unit,
#                 cue, demo (file in gif/), superset (a letter on two rows next
#                 to each other), skip (true = dimmed, not counted).
# Type plain hyphens: "3-4" shows as "3–4".

title: Workout App
heading: Strength program

# Exercises used in more than one session. List them by name below.
shared:
  Banded mountain climber: { sets: 2, reps: 6, unit: per side, demo: ly-climber.mp4 }
  Side plank + leg raise:  { sets: 2, reps: 6-8, unit: per side, cue: On forearm, demo: ly-side-plank.mp4 }
  Bird dog:                { sets: 2, reps: 6, unit: per side, cue: 5 s hold, demo: ly-bird-dog.mp4 }
  Banded knee drive:       { sets: 2, reps: 8, unit: per side, demo: ly-hip-flexion.mp4 }
  Lateral band walk:       { sets: 2, reps: 10, unit: each way, cue: Band above knees, demo: ly-band-walk.mp4 }
  Lying nerve glide:       { sets: 2, reps: 10-15, cue: Right leg, demo: nerve-glide-lying.mp4 }

sessions:
  Upper 1:
    Warm-up:
      - name: Shoulder mobility
        time: 5 min
        cue: Pass-throughs, pull-aparts, wall slides
        demo: ly-shoulder.mp4
      - Banded mountain climber
      - Side plank + leg raise
      - Bird dog
    Workout:
      - name: Weighted pull-up
        sets: 3-4
        reps: 3-6
        superset: A
        demo: ly-pull-up.mp4
      - name: Standing 1-arm DB press
        sets: 3
        reps: 4-6
        unit: per side
        cue: No sideways lean
        superset: A
        demo: ly-press.mp4
      - name: Weighted dip
        sets: 3
        reps: 5-8
        superset: B
        demo: ly-dip.mp4
      - name: DB curl
        sets: 3
        reps: 8-10
        superset: B
        demo: ly-curl.mp4
      - name: DB lateral raise
        sets: 3
        reps: 10-15
        demo: ly-lateral-raise.mp4
      - name: Neck flexion, extension, lateral
        sets: 2
        reps: 10-15
        unit: each
        cue: Light plate, slow
        demo: neck-3way.mp4

  Lower 1:
    Warm-up:
      - Banded knee drive
      - Lateral band walk
      - name: Lateral hop-and-stick
        sets: 2
        reps: 3
        unit: per side
        cue: Small, quiet landing
        demo: ly-skater.mp4
      - Lying nerve glide
    Workout:
      - name: Kickstand DB RDL
        sets: 3
        reps: 6-8
        unit: per leg
        cue: 3 s down, stop before nerve symptoms
        demo: kickstand-rdl-b.mp4
      - name: Heel-elevated DB squat
        sets: 3
        reps: 6-8
        cue: Heels on wedge, 3 s down
        demo: ly-db-squat.mp4
      - name: Incline hamstring curl
        sets: 3
        reps: 8-12
        cue: EZ Boot
        demo: ly-leg-curl.mp4
      - name: Ring fallout
        sets: 2
        reps: 6-8
        cue: "Later: ab-wheel rollout 3×6–10"
        demo: ly-fallout.mp4
      - name: Suitcase carry
        sets: 2
        time: 30-40 s
        unit: per side
        demo: ly-suitcase.mp4
      - name: Band tibialis raise
        sets: 2
        reps: 15-20
        cue: Seated, knees bent
        superset: A
        demo: tib-band.mp4
      - name: Calf raise
        sets: 3
        reps: 10-15
        cue: Toes on wedge
        superset: A
        demo: ly-calf.mp4

  Upper 2:
    Warm-up:
      - Banded mountain climber
      - Side plank + leg raise
      - Bird dog
    Workout:
      - name: Dynamic band chop
        sets: 2
        reps: 4-6
        unit: per side
        cue: Fast, controlled
        demo: ly-band-chop.mp4
      - name: DB bench press
        sets: 3
        reps: 5-6
        superset: A
        demo: ly-db-bench.mp4
      - name: Rope / towel pull-up
        sets: 3
        reps: 5-8
        superset: A
        demo: towel-pull-up.mp4
      - name: 1-arm DB row
        sets: 3
        reps: 5-8
        unit: per side
        cue: Straps (test edit)
        demo: ly-row.mp4
      - name: Face pull
        sets: 2-3
        reps: 12-20
        demo: ly-face-pull.mp4
      - name: Neck isometrics
        sets: 3
        time: 20 s
        unit: each way
        demo: neck.jpg

  Lower 2:
    Warm-up:
      - Banded knee drive
      - Lateral band walk
      - name: Dead bug
        sets: 2
        reps: 6
        unit: per side
        demo: ly-dead-bug.mp4
      - Lying nerve glide
    Workout:
      - name: KB swing
        sets: 3
        reps: 5-6
        cue: Skip until back healed
        skip: true
        demo: ly-kb-swing.mp4
      - name: Bulgarian split squat
        sets: 3
        reps: 5-8
        unit: per leg
        demo: ly-bss.mp4
      - name: Back extension
        sets: 2
        reps: 10-15
        cue: Top half of the range at first, soft knees, stop at a straight line
        demo: ly-back-ext.mp4
      - name: Weighted hip flexion
        sets: 2
        reps: 8-12
        unit: per leg
        cue: EZ Boot, knee bent
        demo: ly-hip-flexion.mp4
      - name: Copenhagen plank
        sets: 2
        time: 20-30 s
        unit: per side
        demo: ly-copenhagen.webp
      - name: KB pick-up
        sets: 2-3
        time: 60 s
        cue: Last. Nonstop, alternate sides; stop if form slips
        demo: kb-crossover.mp4
